[project]
# Distribution name kept for continuity; the project and its CLI are "Lexicon"
name = "linguistic-stratigraphy"
version = "0.1.0"
description = "Lexicon: computational linguistic stratigraphy - a Neo4j graph of dated word records for dating texts, flagging anachronisms and finding language contact"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Kase Branham" }
]
keywords = [
    "linguistics",
    "etymology",
    "nlp",
    "knowledge-graph",
    "diachronic",
    "historical-linguistics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# requirements.txt pins the tested versions; lower bounds here exclude
# releases with known vulnerabilities
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.24",

    # Databases (the async Elasticsearch client needs its aiohttp transport;
    # client 9.x does not talk to the 8.x server)
    "neo4j>=5.0",
    "elasticsearch[async]>=8.0,<10",
    "aiohttp>=3.14.3",
    "redis>=4.0",

    # Numeric
    "numpy>=1.24",

    # API (fastapi 0.137+ breaks the route-template labels of request metrics)
    "fastapi>=0.135,<0.137",
    "starlette>=1.3.1",
    "uvicorn>=0.23",
    "strawberry-graphql>=0.315.7",

    # Error Tracking & Monitoring (2.56 is the first release that initializes
    # with strawberry-graphql 0.315 and starlette 1.x without jinja2)
    "sentry-sdk[fastapi]>=2.56.0",

    # Utils
    "python-Levenshtein>=0.21",
]

[project.optional-dependencies]
# PostgreSQL is optional and reserved for future use: only the alembic
# migrations and scripts/load_initial_data.py need these
postgres = [
    "asyncpg>=0.28",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

dev = [
    # Testing
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.3",
    "hypothesis>=6.82",

    # Code quality (same versions as requirements-dev.txt, CI and pre-commit)
    "black==26.5.1",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "pre-commit>=3.6",

    # Security
    "bandit==1.9.4",
    "pip-audit>=2.7",

    # Type stubs
    "types-requests>=2.31",
    "types-redis>=4.6",
]

[project.urls]
Homepage = "https://github.com/kase1111-hash/Lexicon"
Documentation = "https://github.com/kase1111-hash/Lexicon/tree/main/docs"
Repository = "https://github.com/kase1111-hash/Lexicon"
Issues = "https://github.com/kase1111-hash/Lexicon/issues"
Changelog = "https://github.com/kase1111-hash/Lexicon/blob/main/CHANGELOG.md"

[project.scripts]
ls-api = "src.api.main:run"
ls-ingest = "src.ingestion:main"
lexicon = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.mypy_cache
    | \.ruff_cache
    | \.venv
    | venv
    | __pycache__
    | build
    | dist
)/
'''

# mypy configuration
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# pytest configuration lives in pytest.ini (which takes precedence over
# [tool.pytest.ini_options], so keep a single source of truth there)

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
# Measured floor (69.86% on 2026-09-27 for `pytest tests/ --ignore=tests/performance
# --cov=src` without databases, as CI's coverage job runs it); ratchet it up as
# coverage grows
fail_under = 69
show_missing = true

# Ruff linter configuration
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for FastAPI Depends)
    "SIM102", # collapsible-if (sometimes less readable)
    "UP007",  # use X | Y for Union (pydantic compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = [
    "B101",  # Allow assert in non-test code for now
    "B104",  # Binding to 0.0.0.0 is intentional for containerized deployments
]
