# Pre-commit hooks configuration
# Install: pip install -r requirements-dev.txt && pre-commit install
# Run manually: pre-commit run --all-files
# Tool versions match requirements-dev.txt, which CI installs; bump them together.

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
        # Archived documents are kept as they were written
        exclude: ^docs/archive/
      - id: end-of-file-fixer
        exclude: ^docs/archive/
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key
        # These tests contain fake key markers on purpose
        exclude: ^tests/security/

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  # Python linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml']
        additional_dependencies: ['bandit[toml]']
        exclude: ^tests/

  # Type checking runs in the project environment (like CI's `mypy src`), so
  # it sees the real dependencies instead of an isolated hook environment
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy src
        language: system
        types: [python]
        pass_filenames: false

# CI configuration
ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  skip: [mypy]
