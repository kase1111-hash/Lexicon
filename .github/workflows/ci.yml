name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Same versions as requirements-dev.txt and .pre-commit-config.yaml
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install $(grep -E '^(ruff|black)==' requirements-dev.txt)

      - name: Run ruff
        run: ruff check src tests

      - name: Check formatting with black
        run: black src tests --check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt $(grep -E '^(mypy|types-)' requirements-dev.txt)

      - name: Run mypy
        run: mypy src

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit and pip-audit
        run: pip install $(grep -E '^(bandit|pip-audit)' requirements-dev.txt)

      - name: Run bandit security scan
        run: bandit -r src -c pyproject.toml

      - name: Audit runtime dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Every test suite; tests that need a database skip themselves here
      # (tests/conftest.py points all stores at unreachable addresses)
      - name: Run tests
        run: pytest tests/ --ignore=tests/performance --tb=short

      # Micro-benchmarks with absolute thresholds depend on the runner's speed,
      # so they are reported but do not fail the build
      - name: Run performance tests (informational)
        continue-on-error: true
        run: pytest tests/performance --tb=short

  test-db:
    name: Test with Neo4j
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.9
        env:
          NEO4J_AUTH: neo4j/testpassword123
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      # The only way tests reach a database (see tests/conftest.py)
      TEST_NEO4J_URI: bolt://localhost:7687
      TEST_NEO4J_PASSWORD: testpassword123
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests against Neo4j
        run: pytest tests/ --ignore=tests/performance --tb=short

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Fails below [tool.coverage.report] fail_under in pyproject.toml.
      # Performance tests assert timings, which coverage tracing distorts.
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/performance \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t lexicon-api:ci .

      - name: Smoke-test the image
        run: >-
          docker run --rm -e NEO4J_URI=bolt://127.0.0.1:1 lexicon-api:ci
          python -c "import src.api.main, src.cli, src.ingestion; print('imports ok')"

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 7
