# Development override for docker compose (loaded automatically by
# `docker compose up`, and not by `-f docker-compose.yml -f
# docker-compose.production.yml`). Credentials come from .env; do not set them
# here, or the api service and the databases disagree on passwords.

services:
  api:
    container_name: ls-api-dev
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src:ro
    # Like the image's CMD: X-Forwarded-For is trusted from FORWARDED_ALLOW_IPS
    command: uvicorn src.api.main:app --reload --host 0.0.0.0 --port 8000 --proxy-headers
