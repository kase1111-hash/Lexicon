# Production overlay. Usage (API_KEY is mandatory):
#   docker compose --env-file /secure/place/lexicon.env \
#       -f docker-compose.yml -f docker-compose.production.yml up -d
# (start from config/.env.production). Runs the image that the release
# workflow publishes, ghcr.io/kase1111-hash/lexicon:<VERSION>; pass --build to
# build it from this checkout instead.
#
# TLS: the API is published on 127.0.0.1:8000 only, like every other service.
# Put a TLS-terminating reverse proxy (nginx, Caddy, Traefik) in front of it.
# Elasticsearch and Redis stay on the internal network without TLS.
#
# Client addresses: the rate limit counts per client address, and the proxy's
# connections reach the container from the ls-network gateway. Set
# FORWARDED_ALLOW_IPS in the env file to that gateway
#   docker network inspect <project>_ls-network -f '{{(index .IPAM.Config 0).Gateway}}'
# (or to 172.16.0.0/12, Docker's default bridge range, if the network may be
# recreated with another subnet) so that uvicorn takes the client from the
# X-Forwarded-For header the proxy sets; otherwise all clients share one budget.

services:
  api:
    image: ghcr.io/kase1111-hash/lexicon:${VERSION:-latest}
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=json
      - API_KEY=${API_KEY:?API_KEY is required in production}
      - RATE_LIMIT_ENABLED=true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      # The slim image has no curl; /health is 503 while Neo4j is unreachable
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Managed databases instead of the bundled ones: the api's connection
  # settings are fixed in docker-compose.yml, so add one more overlay
  # (-f managed.yml) that replaces them and the api's wait for Neo4j:
  #   services:
  #     api:
  #       environment:
  #         - NEO4J_URI=neo4j+s://<host>
  #         - ELASTICSEARCH_URI=https://<user>:<password>@<host>:9243
  #         - REDIS_URI=rediss://:<password>@<host>:6380
  #       depends_on: !reset {}
  # (docker compose 2.24+), then start only the services you keep, e.g.
  # `... up -d api`. A *_URI wins over the *_HOST / *_PASSWORD settings, which
  # the env file must still define; URL-encode passwords in a URI. The api
  # logs in to Neo4j as NEO4J_USER (set it in the overlay if not neo4j) with
  # NEO4J_PASSWORD. Leave out the lines of any bundled service you keep.
  neo4j:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # Only with the "postgres" profile (reserved for future use)
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G

  elasticsearch:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
